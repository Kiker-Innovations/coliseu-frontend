<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coliseu - Página não encontrada</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#c96b3d">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f8f1ea 0%, #ede5db 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      background: white;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    .code {
      font-size: 8rem;
      font-weight: 900;
      color: rgba(201, 107, 61, 0.15);
      line-height: 1;
      margin-bottom: -3rem;
      user-select: none;
    }
    .icon-wrapper {
      width: 5rem;
      height: 5rem;
      background: rgba(201, 107, 61, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon {
      width: 2.5rem;
      height: 2.5rem;
      color: #c96b3d;
    }
    h1 {
      font-size: 1.5rem;
      color: #2d2d2d;
      margin-bottom: 0.5rem;
    }
    p {
      color: #666;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .buttons {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: #c96b3d;
      color: white;
    }
    .btn-primary:hover {
      background: #b55d32;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #ddd;
      color: #333;
    }
    .btn-outline:hover {
      background: #f5f5f5;
    }
    .loading {
      display: none;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #888;
    }
    @media (max-width: 480px) {
      .code { font-size: 6rem; margin-bottom: -2rem; }
      .icon-wrapper { width: 4rem; height: 4rem; }
      .icon { width: 2rem; height: 2rem; }
      h1 { font-size: 1.25rem; }
    }
  </style>
  <script>
    // Redirect to SPA if JavaScript is enabled
    (function() {
      var path = window.location.pathname;
      // If this is an asset request, don't redirect
      if (path.match(/\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|webmanifest)$/)) {
        return;
      }
      // Redirect to index with the current path as a hash
      // This allows the SPA router to handle the route
      if (path !== '/' && path !== '/index.html') {
        document.getElementById('loading').style.display = 'block';
        window.location.replace('/#' + path);
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <div class="icon-wrapper">
      <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
    </div>
    <h1>Página não encontrada</h1>
    <p>A página que você está procurando não existe ou foi movida.</p>
    <div class="buttons">
      <button class="btn btn-outline" onclick="history.back()">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Voltar
      </button>
      <a href="/" class="btn btn-primary">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Ir para o início
      </a>
    </div>
    <p id="loading" class="loading">Redirecionando...</p>
  </div>
</body>
</html>
